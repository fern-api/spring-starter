name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@v1
      - name: fern generate
        run: fern generate
        env:
          FERN_TOKEN: dummy
      - name: Compile
        run: ./gradlew compileJava
      - name: Unit Test
        run: ./gradlew test
